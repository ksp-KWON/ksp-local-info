name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ["로컬인포 자동글쓰기"]
    types: [completed]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=ksp-local-info --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── 최신 글 메타데이터 추출 ─────────────────────────────────────────
      - name: 최신 글 정보 추출
        if: success()
        run: node scripts/extract-latest-post.js

      # ── 배포 완료 브리핑 이메일 발송 ─────────────────────────────────────
      - name: 배포 완료 브리핑 이메일 발송
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[의정부심] 자동 발행 & 배포 완료: ${{ env.POST_TITLE }}"
          to: ${{ secrets.GMAIL_USER }}
          from: 의정부심 포털 <${{ secrets.GMAIL_USER }}>
          html_body: |
            <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #222; max-width: 580px; margin: 0 auto; padding: 24px; border: 1px solid #e5e7eb; border-radius: 8px;">
              <h2 style="color: #111; margin-top: 0; font-size: 20px; border-bottom: 2px solid #111; padding-bottom: 12px;">🏛️ 의정부심 데일리 글쓰기 & 배포 완료</h2>
              <p style="font-size: 15px; color: #4b5563;">오늘자 신규 시정 안내 포스팅과 웹사이트 배포가 성공적으로 완료되었습니다.</p>
              
              <div style="background-color: #f9fafb; padding: 18px; border-left: 4px solid #111; margin: 20px 0; border-radius: 4px;">
                <p style="font-size: 13px; color: #6b7280; margin: 0 0 6px 0; font-weight: bold;">오늘 발행된 포스팅</p>
                <h3 style="margin: 0 0 14px 0; color: #111; font-size: 17px;">${{ env.POST_TITLE }}</h3>
                <a href="https://uijeongbusim.com/blog/${{ env.POST_SLUG }}" style="display: inline-block; padding: 10px 18px; background-color: #111; color: #fff; text-decoration: none; border-radius: 4px; font-size: 14px; font-weight: bold;">웹사이트에서 바로 확인하기 →</a>
              </div>

              <div style="border-top: 1px solid #e5e7eb; padding-top: 14px; font-size: 12px; color: #9ca3af;">
                <p style="margin: 0;">포털 주소: <a href="https://uijeongbusim.com" style="color: #4b5563; text-decoration: underline;">uijeongbusim.com</a></p>
                <p style="margin: 4px 0 0 0;">본 메일은 의정부 건강·생활 정보 포털 GitHub Actions에서 자동 발송되었습니다.</p>
              </div>
            </div>
