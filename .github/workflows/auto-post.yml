name: 濡쒖뺄?명룷 ?먮룞湲?곌린

on:
  # 留ㅼ씪 ?ㅼ쟾 8??(KST) = UTC 23:00 ?꾨궇
  schedule:
    - cron: '0 23 * * *'
  # ?섎룞 ?ㅽ뻾 (?뚯뒪?몄슜)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: ??μ냼 泥댄겕?꾩썐
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js ?ㅼ젙
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: ?섏〈???ㅼ튂
        run: npm ci

      # ?? 怨듦났?곗씠???섏쭛 (?ㅽ뙣?대룄 ?ㅼ쓬 ?④퀎 吏꾪뻾) ??????????????????????
      - name: 怨듦났?곗씠???섏쭛
        id: fetch_data
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "?뵇 怨듦났?곗씠???섏쭛 ?쒖옉 (scripts/fetch-public-data.js)"
          node scripts/fetch-public-data.js && echo "FETCH_OK=true" >> $GITHUB_OUTPUT || echo "FETCH_OK=false" >> $GITHUB_OUTPUT

      # ?? 釉붾줈洹?湲?곌린 (?ㅽ뙣?대룄 而ㅻ컠 ?④퀎 吏꾪뻾) ????????????????????????
      - name: 釉붾줈洹??먮룞湲?곌린
        id: generate_post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "?랃툘 釉붾줈洹?湲?곌린 ?쒖옉 (scripts/generate-blog-post.js)"
          node scripts/generate-blog-post.js && echo "GENERATE_OK=true" >> $GITHUB_OUTPUT || echo "GENERATE_OK=false" >> $GITHUB_OUTPUT

      # ?? ?앹꽦???뚯씪 而ㅻ컠 & ?몄떆 ?????????????????????????????????????????
      - name: 蹂寃쎌궗??而ㅻ컠 & ?몄떆
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ?먮룞 ?묒꽦 寃곌낵臾??ㅽ뀒?댁쭠
          git add public/data/local-info.json src/content/posts/ || true

          # 蹂寃쎌궗??씠 ?덉쓣 ?뚮쭔 而ㅻ컠
          if ! git diff --cached --quiet; then
            git commit -m "auto: ?먮룞湲?곌린 ?낅뜲?댄듃 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin main
            echo "??而ㅻ컠 & ?몄떆 ?꾨즺"
          else
            echo "?뱄툘 蹂寃쎌궗???놁쓬 ??而ㅻ컠 嫄대꼫?"
          fi

      # ?? ?ㅽ뻾 寃곌낵 ?붿빟 ???????????????????????????????????????????????????
      - name: ?ㅽ뻾 寃곌낵 ?붿빟
        if: always()
        run: |
          echo "?뱤 ?ㅽ뻾 寃곌낵 ?붿빟"
          echo "  - ?곗씠???섏쭛 : ${{ steps.fetch_data.outputs.FETCH_OK == 'true' && '???깃났' || '?좑툘 ?ㅽ뙣/?곗씠?곗뾾?? }}"
          echo "  - 釉붾줈洹?湲?곌린: ${{ steps.generate_post.outputs.GENERATE_OK == 'true' && '???깃났' || '?좑툘 ?ㅽ뙣/湲?놁쓬' }}"

