name: Export Secrets Temporary

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Export Secrets Hex
        env:
          T_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          T_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          T_GEMINI: ${{ secrets.GEMINI_API_KEY }}
          T_PUBLIC: ${{ secrets.PUBLIC_DATA_API_KEY }}
          T_GMAIL_USER: ${{ secrets.GMAIL_USER }}
          T_GMAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          node -e '
          const keys = ["T_CF_TOKEN", "T_CF_ACCOUNT", "T_GEMINI", "T_PUBLIC", "T_GMAIL_USER", "T_GMAIL_PASS"];
          for (const k of keys) {
            const val = process.env[k] || "";
            const hex = Buffer.from(val).toString("hex").match(/.{1,2}/g)?.join(" ") || "";
            console.log("HEX_" + k + ": " + hex);
          }
          '
